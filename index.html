<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: pink;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #1e293b;
        }

        h1 {
            margin: 0;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.5rem;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #1e293b;
        }
    </style>
</head>
<body>

<header>
    <h1>My Landing Page</h1>
</header>

<section class="hero">
    <h2>Build. Break. Learn. Repeat.</h2>
    <p>Start your coding journey again — one step at a time.</p>
    <button class="btn">Get Started</button>
</section>

<footer>
    <p>© 2026 Your Name</p>
</footer>

</body>
</html>
